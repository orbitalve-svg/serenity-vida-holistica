<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Iconos generados desde el logo real de la marca -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0F0A1C" />

    <!-- Sin ciudad en el title: no hay local fijo y se atiende a distancia,
         así que se compite por modalidad («a distancia», «online») y no por
         geografía. Description ≤155 caracteres: Google corta ahí. -->
    <title>Serenity Vida Holística · Reiki y Registros Akáshicos online</title>
    <meta
      name="description"
      content="Terapias holísticas con Yulexy Rodríguez: Reiki a distancia, Constelaciones Familiares y Formaciones certificadas de Reiki Usui y Registros Akáshicos."
    />

    <!--
      Datos estructurados (schema.org). `ProfessionalService` y NO
      `LocalBusiness` con dirección: no hay local fijo, las sesiones
      presenciales se coordinan al agendar y el resto es a distancia. Declarar
      una dirección donde no se atiende es dato falso —y una ficha de Google
      así acaba suspendida—, por eso va `areaServed` en su lugar.
      Al tener dominio: añadir "url" e "image" con URL absoluta.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Serenity Vida Holística",
        "description": "Terapias holísticas y formación espiritual, presenciales con cita coordinada y a distancia: Reiki, Constelaciones Familiares, Coaching Sistémico, Registros Akáshicos, armonización de chakras y masajes energéticos.",
        "telephone": "+593964053009",
        "availableLanguage": "es",
        "areaServed": [
          { "@type": "Country", "name": "Ecuador" },
          { "@type": "Country", "name": "Venezuela" }
        ],
        "founder": {
          "@type": "Person",
          "name": "Yulexy Rodríguez",
          "jobTitle": "Terapeuta Holística y Coach Sistémico"
        },
        "sameAs": ["https://instagram.com/terapiasanacionyluz"],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Reiki presencial y a distancia" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Constelaciones Familiares" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Lectura de Registros Akáshicos" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Limpieza y Armonización de Chakras" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Masaje Energético con Reiki" } },
          { "@type": "Offer", "itemOffered": { "@type": "Course", "name": "Formación de Reiki Usui" } },
          { "@type": "Offer", "itemOffered": { "@type": "Course", "name": "Formación de Registros Akáshicos" } }
        ]
      }
    </script>

    <!--
      Tarjeta al compartir. Importa especialmente en WhatsApp, que es por donde
      llega y se reenvía la mayoría del público: sin esto sólo se ve el enlace
      pelado, sin imagen ni título.
      Al publicar, sustituir el dominio de og:url y og:image por el definitivo.
    -->
    <meta property="og:type" content="website" />
    <!-- `es` neutro y no `es_VE`: el público está en Ecuador, Venezuela y el
         resto de Latinoamérica. -->
    <meta property="og:locale" content="es" />
    <meta property="og:site_name" content="Serenity Vida Holística" />
    <meta property="og:title" content="Serenity Vida Holística · Tus raíces guardan tu historia" />
    <meta
      property="og:description"
      content="Terapias holísticas con Yulexy Rodríguez: Reiki, Constelaciones Familiares y Registros Akáshicos. Presencial y a distancia."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sello de Serenity Vida Holística sobre un cielo estrellado" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Serenity Vida Holística · Tus raíces guardan tu historia" />
    <meta
      name="twitter:description"
      content="Terapias holísticas, Reiki, Constelaciones Familiares y Registros Akáshicos con Yulexy Rodríguez."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
