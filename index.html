<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Iconos generados desde el logo real de la marca -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0F0A1C" />

    <!-- Title con la ciudad: para un negocio local, «Lechería» en el título
         pesa más que cualquier otra palabra. Description ≤155 caracteres:
         Google corta ahí y antes se perdía el final. -->
    <title>Serenity Vida Holística · Terapias y Reiki en Lechería</title>
    <meta
      name="description"
      content="Terapias holísticas, Reiki, Constelaciones Familiares y Formaciones de Reiki Usui y Registros Akáshicos con Yulexy Rodríguez en Lechería, Anzoátegui."
    />

    <!--
      Datos estructurados del negocio local (schema.org). Es lo que conecta la
      web con la ficha de Google Maps. Nombre, dirección y teléfono deben ser
      IDÉNTICOS aquí, en el footer y en el perfil de Google Business.
      Al tener dominio: añadir "url" e "image" con URL absoluta, y "openingHours".
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Serenity Vida Holística",
        "description": "Centro de terapias holísticas y formación espiritual: Reiki, Constelaciones Familiares, Coaching Sistémico, Registros Akáshicos, armonización de chakras y masajes energéticos.",
        "telephone": "+584248042545",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "C.C. Anna, Av. Principal de Lechería, Local Étnicas",
          "addressLocality": "Lechería",
          "addressRegion": "Anzoátegui",
          "addressCountry": "VE"
        },
        "areaServed": ["Lechería", "Barcelona", "Puerto La Cruz", "Venezuela"],
        "founder": {
          "@type": "Person",
          "name": "Yulexy Rodríguez",
          "jobTitle": "Terapeuta Holística y Coach Sistémico"
        },
        "sameAs": ["https://instagram.com/terapiasanacionyluz"],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Reiki presencial y a distancia" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Constelaciones Familiares" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Lectura de Registros Akáshicos" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Limpieza y Armonización de Chakras" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Masaje Energético con Reiki" } },
          { "@type": "Offer", "itemOffered": { "@type": "Course", "name": "Formación de Reiki Usui" } },
          { "@type": "Offer", "itemOffered": { "@type": "Course", "name": "Formación de Registros Akáshicos" } }
        ]
      }
    </script>

    <!--
      Tarjeta al compartir. Importa especialmente en WhatsApp, que es por donde
      llega y se reenvía la mayoría del público: sin esto sólo se ve el enlace
      pelado, sin imagen ni título.
      Al publicar, sustituir el dominio de og:url y og:image por el definitivo.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_VE" />
    <meta property="og:site_name" content="Serenity Vida Holística" />
    <meta property="og:title" content="Serenity Vida Holística · Tus raíces guardan tu historia" />
    <meta
      property="og:description"
      content="Terapias holísticas, Reiki, Constelaciones Familiares y Registros Akáshicos con Yulexy Rodríguez. Lechería, Anzoátegui."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sello de Serenity Vida Holística sobre un cielo estrellado" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Serenity Vida Holística · Tus raíces guardan tu historia" />
    <meta
      name="twitter:description"
      content="Terapias holísticas, Reiki, Constelaciones Familiares y Registros Akáshicos con Yulexy Rodríguez."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
