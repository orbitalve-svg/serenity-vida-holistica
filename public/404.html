<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Página no encontrada · Serenity Vida Holística</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 2rem 1.5rem; text-align: center;
        background: radial-gradient(120% 90% at 50% 0%, #2d1547 0%, #1a0e2e 45%, #0f0a1c 100%);
        color: #fbf6ec;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .eyebrow {
        font-size: .72rem; letter-spacing: .3em; text-transform: uppercase;
        color: #c9a84c; margin: 0 0 1rem;
      }
      h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); font-style: italic; font-weight: 400; margin: 0 0 1rem; line-height: 1.15; }
      p { color: #cbb8dc; max-width: 34rem; margin: 0 auto 2rem; line-height: 1.6; }
      .acciones { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
      a {
        display: inline-block; padding: .85rem 1.6rem; border-radius: 999px;
        text-decoration: none; font-weight: 600; font-size: .95rem;
      }
      .principal { background: #c9a84c; color: #0f0a1c; }
      .secundario { border: 1px solid rgba(255,255,255,.25); color: #fbf6ec; }
      a:hover { opacity: .88; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Esta página se perdió en el camino</h1>
      <p>
        El enlace que seguiste no existe o cambió de sitio. Puedes volver al inicio, o
        escribirme por WhatsApp y te oriento directamente.
      </p>
      <div class="acciones">
        <a class="principal" href="/">Volver al inicio</a>
        <a class="secundario" href="/#servicios">Ver los servicios</a>
        <a class="secundario" href="https://wa.me/593964053009">Escribir por WhatsApp</a>
      </div>
    </main>
  </body>
</html>
